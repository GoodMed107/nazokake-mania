# Render 用の設定（Blueprint）。リポジトリを Render に繋ぐと自動で読み込まれます。
services:
  - type: web
    name: nazokake-mania
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      # Gemini のAPIキーは Render のダッシュボードで手入力（ここには書かない＝GitHubに載らない）
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"
      # 第一候補モデル。使えない場合はサーバーが使えるモデルを自動選択する。
      - key: NAZOKAKE_MODEL
        value: gemini-3.6-flash
