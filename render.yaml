# Render 用の設定（Blueprint）。リポジトリを Render に繋ぐと自動で読み込まれます。
services:
  - type: web
    name: nazokake-mania
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      # APIキーは Render のダッシュボードで手入力（ここには書かない＝GitHubに載らない）
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"
      # 速度・コスト重視なら claude-haiku-4-5 に変えると軽い
      - key: NAZOKAKE_MODEL
        value: claude-opus-5
