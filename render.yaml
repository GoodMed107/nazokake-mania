# Render 用の設定（Blueprint）。リポジトリを Render に繋ぐと自動で読み込まれます。
services:
  - type: web
    name: nazokake-mania
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      # Gemini のAPIキーは Render のダッシュボードで手入力（ここには書かない＝GitHubに載らない）
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"
      # 使うモデル。gemini-2.5-flash は無料枠・高速（gemini-2.0-flash は提供終了）
      - key: NAZOKAKE_MODEL
        value: gemini-2.5-flash
